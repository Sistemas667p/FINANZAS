<script>
    let tipoActual = '';
    let datosCaja = 0;
    let datosSobrante = 0;
    let datosIngresos = 0;
    let movimientosActuales = [];
    let historialCiclos = [];
    let indiceCicloSeleccionado = null;

    window.onload = function() {
        cargarDatosLocales(); // <-- CARGA LOS DATOS AL ABRIR
        bloquearAppTotal();
    };

    // --- FUNCIONES DE ALMACENAMIENTO LOCAL (PERSISTENCIA) ---
    function guardarDatosLocales() {
        const data = {
            caja: datosCaja,
            sobrante: datosSobrante,
            ingresos: datosIngresos,
            periodoActual: document.getElementById('textoPeriodoActual').textContent,
            movimientos: movimientosActuales,
            historial: historialCiclos
        };
        localStorage.setItem('financeos_data', JSON.stringify(data));
    }

    function cargarDatosLocales() {
        const guardado = localStorage.getItem('financeos_data');
        if (guardado) {
            try {
                const data = JSON.parse(guardado);
                datosCaja = data.caja || 0;
                datosSobrante = data.sobrante || 0;
                datosIngresos = data.ingresos || 0;
                if (data.periodoActual) {
                    document.getElementById('textoPeriodoActual').textContent = data.periodoActual;
                    document.getElementById('cfgNombrePeriodo').value = data.periodoActual;
                }
                movimientosActuales = data.movimientos || [];
                historialCiclos = data.historial || [];

                renderizarMovimientosActuales();
                renderizarHistorial();
                actualizarPantalla();
            } catch (e) {
                console.error("Error al cargar datos locales", e);
            }
        }
    }
    // -------------------------------------------------------

    function bloquearAppTotal() {
        document.getElementById('inputPinBloqueo').value = '';
        document.getElementById('pantallaBloqueo').style.display = 'flex';
    }

    function verificarPin() {
        const pinIngresado = document.getElementById('inputPinBloqueo').value;
        if(pinIngresado === '1601') {
            document.getElementById('pantallaBloqueo').style.display = 'none';
        } else {
            alert('PIN Incorrecto. El PIN predeterminado es 1601.');
            document.getElementById('inputPinBloqueo').value = '';
        }
    }

    function cambiarPestaña(tabName, event) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        
        if(tabName === 'panel') {
            document.getElementById('tab-panel').classList.add('active');
        } else {
            document.getElementById('tab-historial').classList.add('active');
        }
        event.currentTarget.classList.add('active');
    }

    function abrirModal(tipo) {
        tipoActual = tipo;
        const modal = document.getElementById('modalAccion');
        const titulo = document.getElementById('modalTitulo');
        const grupoCat = document.getElementById('grupoCategoria');
        const labelConc = document.getElementById('labelConcepto');

        if (tipo === 'ingreso') {
            titulo.textContent = 'Registrar Ingreso Extra';
            labelConc.textContent = 'Concepto (Ej. Changas, Venta)';
            grupoCat.style.display = 'none';
        } else {
            titulo.textContent = 'Registrar Gasto';
            labelConc.textContent = 'Concepto / Detalle';
            grupoCat.style.display = 'block';
        }

        document.getElementById('inputConcepto').value = '';
        document.getElementById('inputMonto').value = '';
        modal.style.display = 'flex';
    }

    function cerrarModal(idModal) {
        document.getElementById(idModal).style.display = 'none';
    }

    function abrirCerrarCiclo() {
        document.getElementById('inputNuevoSueldo').value = '0';
        document.getElementById('modalCiclo').style.display = 'flex';
    }

    function abrirConfiguracion() {
        document.getElementById('modalConfig').style.display = 'flex';
    }

    function guardarConfiguracion() {
        const nuevoPeriodo = document.getElementById('cfgNombrePeriodo').value;
        document.getElementById('textoPeriodoActual').textContent = nuevoPeriodo;
        guardarDatosLocales(); // <-- GUARDAR CAMBIO
        cerrarModal('modalConfig');
        alert('Configuración guardada correctamente.');
    }

    function guardarAccion() {
        const concepto = document.getElementById('inputConcepto').value || (tipoActual === 'ingreso' ? 'Ingreso extra' : 'Gasto general');
        const monto = parseFloat(document.getElementById('inputMonto').value);
        
        if (isNaN(monto) || monto <= 0) {
            alert('Por favor ingresá un monto válido.');
            return;
        }

        let detalleMovimiento = {
            tipo: tipoActual,
            concepto: concepto,
            monto: monto,
            categoria: tipoActual === 'gasto' ? document.getElementById('selectCategoria').value : 'Ingreso Extra'
        };

        movimientosActuales.push(detalleMovimiento);

        if (tipoActual === 'ingreso') {
            datosIngresos += monto;
            datosCaja += monto;
        } else {
            datosCaja -= monto;
        }

        renderizarMovimientosActuales();
        actualizarPantalla();
        guardarDatosLocales(); // <-- GUARDAR AUTOMÁTICAMENTE
        cerrarModal('modalAccion');
    }

    function renderizarMovimientosActuales() {
        const lista = document.getElementById('listaMovimientos');
        lista.innerHTML = `
            <div class="transaction-item">
                <div class="t-info">
                    <div>Sueldo / Inicio de Ciclo</div>
                    <div>Base inicial</div>
                </div>
                <div class="t-amount income">+$${datosSobrante.toLocaleString()}</div>
            </div>
        `;

        movimientosActuales.forEach(m => {
            const item = document.createElement('div');
            item.className = 'transaction-item';
            if (m.tipo === 'ingreso') {
                item.innerHTML = `
                    <div class="t-info">
                        <div>${m.concepto}</div>
                        <div>Ingreso Extra</div>
                    </div>
                    <div class="t-amount income">+$${m.monto.toLocaleString()}</div>
                `;
            } else {
                item.innerHTML = `
                    <div class="t-info">
                        <div>${m.concepto}</div>
                        <div>${m.categoria}</div>
                    </div>
                    <div class="t-amount expense">-$${m.monto.toLocaleString()}</div>
                `;
            }
            lista.prepend(item);
        });
    }

    function ejecutarCierreCiclo() {
        const nuevoSueldo = parseFloat(document.getElementById('inputNuevoSueldo').value) || 0;
        const periodoActual = document.getElementById('textoPeriodoActual').textContent;
        
        historialCiclos.push({
            periodo: periodoActual,
            sobranteFinal: datosCaja,
            movimientos: [...movimientosActuales]
        });

        renderizarHistorial();

        datosSobrante = datosCaja > 0 ? datosCaja : 0;
        datosIngresos = nuevoSueldo;
        datosCaja = datosSobrante + datosIngresos;
        movimientosActuales = [];

        renderizarMovimientosActuales();
        document.getElementById('textoPeriodoActual').textContent = "5 Septiembre Al 4 De Octubre";

        actualizarPantalla();
        guardarDatosLocales(); // <-- GUARDAR CAMBIO DE CICLO
        cerrarModal('modalCiclo');
        alert(`¡Ciclo cerrado! Se arrastraron $${datosSobrante.toLocaleString()} al nuevo período.`);
    }

    function renderizarHistorial() {
        const contenedor = document.getElementById('listaCiclosAnteriores');
        contenedor.innerHTML = '';
        
        if(historialCiclos.length === 0) {
            contenedor.innerHTML = `<p style="font-size: 12px; color: #8b949e; text-align: center; padding: 10px;">Aún no hay ciclos cerrados en el historial.</p>`;
            return;
        }

        historialCiclos.forEach((c, index) => {
            contenedor.innerHTML += `
                <div class="cycle-card-hist" onclick="verDetalleCiclo(${index})">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="font-weight: bold; color: #f3f4f6; font-size: 13px;">${c.periodo}</div>
                        <div style="color: #34d399; font-size: 11px;">Ver Gastos 🔍</div>
                    </div>
                    <div style="font-size: 11px; color: #8b949e; margin-top: 4px;">Sobrante guardado: $${c.sobranteFinal.toLocaleString()}</div>
                </div>
            `;
        });
    }

    function verDetalleCiclo(index) {
        indiceCicloSeleccionado = index;
        const ciclo = historialCiclos[index];
        document.getElementById('tituloDetalleHistorial').textContent = ciclo.periodo;
        const contenedorDetalle = document.getElementById('contenidoDetalleMovimientos');
        
        contenedorDetalle.innerHTML = `<div style="font-size: 12px; color: #8b949e; margin-bottom: 8px;">Sobrante final: $${ciclo.sobranteFinal.toLocaleString()}</div>`;
        
        if(ciclo.movimientos.length === 0) {
            contenedorDetalle.innerHTML += `<p style="font-size: 13px; color: #8b949e;">No se registraron movimientos en este ciclo.</p>`;
        } else {
            ciclo.movimientos.forEach(m => {
                const claseColor = m.tipo === 'ingreso' ? 'color: #34d399;' : 'color: #f87171;';
                const signo = m.tipo === 'ingreso' ? '+' : '-';
                contenedorDetalle.innerHTML += `
                    <div class="transaction-item">
                        <div class="t-info">
                            <div>${m.concepto}</div>
                            <div>${m.categoria}</div>
                        </div>
                        <div style="${claseColor} font-weight: bold; font-size: 13px;">${signo}$${m.monto.toLocaleString()}</div>
                    </div>
                `;
            });
        }

        document.getElementById('modalDetalleCiclo').style.display = 'flex';
    }

    function exportarExcelMesActual() {
        let csv = "Tipo,Concepto,Categoria,Monto\n";
        movimientosActuales.forEach(m => {
            csv += `${m.tipo},"${m.concepto}","${m.categoria}",${m.monto}\n`;
        });
        descargarArchivoCSV(csv, "Informe_Mes_Actual.csv");
    }

    function exportarExcelCicloSeleccionado() {
        if(indiceCicloSeleccionado === null) return;
        const ciclo = historialCiclos[indiceCicloSeleccionado];
        let csv = `Periodo:,${ciclo.periodo}\nSobrante Final:,${ciclo.sobranteFinal}\n\nTipo,Concepto,Categoria,Monto\n`;
        ciclo.movimientos.forEach(m => {
            csv += `${m.tipo},"${m.concepto}","${m.categoria}",${m.monto}\n`;
        });
        descargarArchivoCSV(csv, `Informe_${ciclo.periodo.replace(/ /g, "_")}.csv`);
    }

    function descargarArchivoCSV(contenido, nombreArchivo) {
        const blob = new Blob([contenido], { type: 'text/csv;charset=utf-8;' });
        const enlace = document.createElement("a");
        enlace.href = URL.createObjectURL(blob);
        enlace.download = nombreArchivo;
        enlace.click();
    }

    function exportarBackupData() {
        const data = {
            caja: datosCaja,
            sobrante: datosSobrante,
            ingresos: datosIngresos,
            periodoActual: document.getElementById('textoPeriodoActual').textContent,
            movimientos: movimientosActuales,
            historial: historialCiclos
        };
        const codigoJson = JSON.stringify(data);
        navigator.clipboard.writeText(codigoJson);
        alert("¡Backup copiado al portapapeles! Pasalo a tu otro celular y pegalo en el campo de restaurar.");
    }

    function importarBackupData() {
        try {
            const codigoJson = document.getElementById('inputBackupRestaurar').value;
            const data = JSON.parse(codigoJson);
            datosCaja = data.caja;
            datosSobrante = data.sobrante;
            datosIngresos = data.ingresos;
            document.getElementById('textoPeriodoActual').textContent = data.periodoActual;
            movimientosActuales = data.movimientos;
            historialCiclos = data.historial;

            renderizarMovimientosActuales();
            renderizarHistorial();
            actualizarPantalla();
            guardarDatosLocales(); // <-- GUARDAR TRAS IMPORTAR
            cerrarModal('modalConfig');
            alert("¡Datos restaurados con éxito!");
        } catch (e) {
            alert("El código de backup no es válido.");
        }
    }

    function actualizarPantalla() {
        document.getElementById('lblCaja').textContent = `$${datosCaja.toLocaleString()}`;
        document.getElementById('lblSobrante').textContent = `$${datosSobrante.toLocaleString()}`;
        document.getElementById('lblIngresos').textContent = `$${datosIngresos.toLocaleString()}`;
    }
</script>
